<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Fursan Super Store – Riyadh</title>
<style>
:root{--wine:#762f37;--dark:#4c1d24;--gold:#d9ad62;--cream:#fffaf2;--ink:#282323;--green:#188b53}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f7f3ed;color:var(--ink)}
header{background:linear-gradient(120deg,var(--dark),var(--wine));color:white;padding:18px 16px}
.wrap{max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:clamp(22px,4vw,32px);font-weight:800}.sub{color:#f4dfbd;margin-top:5px;font-size:14px}
button,.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}.lang{background:var(--gold);color:var(--dark)}
.hero{padding:26px 18px;background:var(--cream);text-align:center}.hero h1{color:var(--wine);margin:4px 0 8px}.hero p{margin:0;color:#625858}
main{padding:20px 14px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea{padding:12px;border:1px solid #ddd;border-radius:10px;background:white;font-size:15px;min-width:0;width:100%;font-family:inherit}
.tools input,.tools select{flex:1;min-width:170px}
.categories{display:flex;gap:8px;overflow:auto;padding:4px 0 15px}
.cat{white-space:nowrap;background:white;border:1px solid #eadfce;color:var(--wine)}
.cat.active{background:var(--wine);color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px}
.card{background:white;border-radius:14px;padding:13px;box-shadow:0 3px 14px #3b25100d;border:1px solid #eee7dd;min-width:0}
.pic{height:125px;border-radius:10px;background:#f6ead9;display:grid;place-items:center;font-size:48px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:16px;margin:10px 0 5px}.price{font-weight:800;color:var(--wine);margin:6px 0 10px}
.add{background:var(--wine);color:white;width:100%}
.panel{margin-top:22px;background:white;padding:16px;border-radius:14px;border:1px solid #eee7dd}
.panel h2{margin:0 0 12px;color:var(--wine)}.cartrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee}
.checkout{background:var(--green);color:white;width:100%;margin-top:12px}
footer{text-align:center;padding:22px 12px;background:var(--dark);color:#f6e7d0;margin-top:25px;font-size:14px}
.small{font-size:13px;color:#766e68}.muted{color:#766e68}.hidden{display:none!important}
.admin-toggle{background:#fff;color:var(--dark);border:1px solid var(--gold)}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.primary{background:var(--wine);color:white}.secondary{background:#eee7dd;color:var(--dark)}.danger{background:#a52828;color:white}.success{background:var(--green);color:white}
.notice{padding:11px;border-radius:10px;background:#fff5df;color:#63451b;margin:10px 0;font-size:14px}
.status{padding:8px 10px;border-radius:8px;background:#f0f7f1;color:#23633a;font-size:13px}
.admin-product{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee;flex-wrap:wrap}
.admin-product button{padding:8px 10px}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.admin-tabs button{background:#eee7dd;color:var(--dark)}.admin-tabs button.active{background:var(--wine);color:white}
@media(min-width:700px){.hero{padding:38px}.pic{height:145px}}

/* Full-width Al Fursan promotional banner */
.promo-banner{width:100%;margin:0;padding:0;background:#fff;line-height:0;overflow:hidden}
.promo-banner img{display:block;width:100%;height:auto;max-height:none;object-fit:contain}
@media(max-width:600px){.promo-banner img{width:100%;height:auto}}

</style>
</head>
